services:
  - type: web
    name: zynthio-api
    runtime: php
    plan: free
    rootDir: backend
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan migrate --force && php artisan storage:link && php artisan optimize
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_KEY
        generateValue: true
